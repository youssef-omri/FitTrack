plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.fittrack'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.example.fittrack"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Enable vector drawable support on API < 21 (safe for minSdk 24, keeps compat)
        vectorDrawables.useSupportLibrary = true
    }

    buildTypes {
        release {
            // Enable R8 full mode for smaller, faster release builds
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // Keep debug fast — no minification
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    // Enable build config for version info access
    buildFeatures {
        buildConfig true
    }

    // Pack only the needed ABI splits for smaller APK on modern devices
    packagingOptions {
        resources {
            excludes += [
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE'
            ]
        }
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material

    // Edge-to-edge & WindowCompat support
    implementation 'androidx.core:core:1.13.1'

    // Glide for efficient image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
